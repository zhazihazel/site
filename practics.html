<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Universe 3D</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #03050c;
    color: white;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

.ui {
    position: fixed;
    top: 30px;
    left: 35px;
    z-index: 2;
    pointer-events: none;
}

.ui h1 {
    letter-spacing: 7px;
    font-size: 22px;
}

.ui p {
    color: #8d9bbd;
    font-size: 12px;
    letter-spacing: 2px;
}

.hint {
    position: fixed;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #9eacd0;
    font-size: 12px;
    letter-spacing: 2px;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="ui">
    <h1>MUSIC UNIVERSE</h1>
    <p>INTERACTIVE 3D ALBUM GLOBE</p>
</div>

<div class="hint">MOVE YOUR MOUSE TO ROTATE THE GLOBE</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

// 1. СОЗДАЁМ СЦЕНУ
const scene = new THREE.Scene();
scene.background = new THREE.Color("#03050c");

// 2. КАМЕРА
const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 10);

// 3. РЕНДЕРЕР
const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;

document.body.appendChild(renderer.domElement);

// Вся модель будет вращаться как единое целое
const globe = new THREE.Group();
scene.add(globe);

// 4. СВЕТ
scene.add(new THREE.AmbientLight(0x7899ff, 2));

const blueLight = new THREE.PointLight(0x2677ff, 45);
blueLight.position.set(3, 3, 5);
scene.add(blueLight);

const purpleLight = new THREE.PointLight(0x9b35ff, 30);
purpleLight.position.set(-4, -2, -3);
scene.add(purpleLight);

// 5. ОСНОВА СФЕРЫ
const radius = 2.5;

const sphereGeometry = new THREE.SphereGeometry(
    radius, 64, 48
);

const sphereMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x10213d,
    metalness: 0.65,
    roughness: 0.32,
    transparent: true,
    opacity: 0.22,
    side: THREE.DoubleSide,
    depthWrite: false
});

const sphere = new THREE.Mesh(
    sphereGeometry,
    sphereMaterial
);

globe.add(sphere);

// 6. СЕТКА ШАРА
const wire = new THREE.LineSegments(
    new THREE.WireframeGeometry(sphereGeometry),
    new THREE.LineBasicMaterial({
        color: 0x4d86ff,
        transparent: true,
        opacity: 0.17
    })
);

globe.add(wire);

// 7. ЭКВАТОР И МЕРИДИАНЫ
function addRing(rotation, color, radius = 2.56) {
    const geometry = new THREE.TorusGeometry(
        radius, 0.008, 8, 160
    );

    const material = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.65
    });

    const ring = new THREE.Mesh(geometry, material);
    ring.rotation.set(...rotation);
    globe.add(ring);
}

addRing([0, 0, 0], 0x49a6ff);
addRing([Math.PI / 2, 0, 0], 0xa05bff);
addRing([0, 0, Math.PI / 2], 0x42ffe0);

// 8. СВЕТЯЩИЕСЯ ТОЧКИ НА ПОВЕРХНОСТИ
const pointGeometry = new THREE.BufferGeometry();
const points = [];

for (let i = 0; i < 500; i++) {
    const y = 1 - 2 * Math.random();
    const angle = Math.random() * Math.PI * 2;
    const r = radius * Math.sqrt(1 - y * y);

    points.push(
        Math.cos(angle) * r,
        y * radius,
        Math.sin(angle) * r
    );
}

pointGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(points, 3)
);

const pointCloud = new THREE.Points(
    pointGeometry,
    new THREE.PointsMaterial({
        color: 0x66caff,
        size: 0.025,
        transparent: true,
        opacity: 0.8
    })
);

globe.add(pointCloud);

// 9. СОЗДАЁМ ОБЛОЖКИ АЛЬБОМОВ
const albums = [
    ["STARBOY", "#ef254f", "#170719"],
    ["ASTROWORLD", "#258cff", "#091a45"],
    ["DAMN.", "#ff3030", "#350d14"],
    ["AFTER HOURS", "#ff572e", "#240b20"],
    ["MIDNIGHTS", "#654dff", "#080d2d"],
    ["HAPPIER", "#e0b27c", "#39271e"],
    ["NEON", "#26f0d0", "#082c35"],
    ["DREAMS", "#bc71ff", "#21103d"],
    ["ECHOES", "#ffbb42", "#36200b"],
    ["COSMOS", "#5e9bff", "#101a3c"],
    ["VIBRATIONS", "#ff63b3", "#320b2c"],
    ["INFINITY", "#65ffb0", "#06291e"]
];

const albumMeshes = [];

albums.forEach((album, index) => {
    // Создаём текстуру обложки
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 320;

    const ctx = canvas.getContext("2d");

    const gradient = ctx.createLinearGradient(0, 0, 256, 320);
    gradient.addColorStop(0, album[1]);
    gradient.addColorStop(1, album[2]);

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 256, 320);

    // Декоративные круги
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.lineWidth = 2;

    for (let r = 35; r < 180; r += 25) {
        ctx.beginPath();
        ctx.arc(128, 135, r, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Музыкальный символ
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = "bold 76px Arial";
    ctx.textAlign = "center";
    ctx.fillText("♫", 128, 155);

    ctx.font = "bold 19px Arial";
    ctx.fillText(album[0], 128, 275);

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.58, 0.72),
        material
    );

    // Равномерное распределение по поверхности сферы
    const y = 1 - 2 * (index + 0.5) / albums.length;
    const ringRadius = Math.sqrt(1 - y * y);
    const angle = index * Math.PI * (3 - Math.sqrt(5));

    const position = new THREE.Vector3(
        Math.cos(angle) * ringRadius * radius,
        y * radius,
        Math.sin(angle) * ringRadius * radius
    );

    mesh.position.copy(position);

    // Обложка смотрит наружу от центра
    mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 0, 1),
        position.clone().normalize()
    );

    mesh.userData.albumIndex = index;

    globe.add(mesh);
    albumMeshes.push(mesh);

    // Светящийся контур обложки
    const border = new THREE.LineSegments(
        new THREE.EdgesGeometry(
            new THREE.PlaneGeometry(0.61, 0.75)
        ),
        new THREE.LineBasicMaterial({
            color: new THREE.Color(album[1]),
            transparent: true,
            opacity: 0.8
        })
    );

    border.position.copy(position.clone().multiplyScalar(1.003));
    border.quaternion.copy(mesh.quaternion);
    globe.add(border);
});

// 10. ЗВЁЗДЫ ВОКРУГ СФЕРЫ
const starPositions = [];

for (let i = 0; i < 1800; i++) {
    starPositions.push(
        (Math.random() - 0.5) * 35,
        (Math.random() - 0.5) * 25,
        (Math.random() - 0.5) * 25
    );
}

const starsGeometry = new THREE.BufferGeometry();

starsGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
    starsGeometry,
    new THREE.PointsMaterial({
        color: 0x9dbaff,
        size: 0.018
    })
);

scene.add(stars);

// 11. УПРАВЛЕНИЕ МЫШЬЮ
let targetX = 0;
let targetY = 0;
let velocity = 0.0015;

const pointer = new THREE.Vector2();
const raycaster = new THREE.Raycaster();

window.addEventListener("pointermove", event => {
    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

    targetY = pointer.x * 0.5;
    targetX = pointer.y * 0.35;

    raycaster.setFromCamera(pointer, camera);

    const hits = raycaster.intersectObjects(albumMeshes);

    albumMeshes.forEach(mesh => {
        mesh.scale.setScalar(1);
    });

    if (hits.length > 0) {
        hits[0].object.scale.setScalar(1.18);
        velocity = 0.012;
    }
});

// 12. АНИМАЦИЯ
function animate() {
    requestAnimationFrame(animate);

    // Плавно поворачиваем глобус
    globe.rotation.y += 0.0015;
    globe.rotation.y += (targetY - globe.rotation.y) * 0.012;

    globe.rotation.x += (targetX - globe.rotation.x) * 0.012;

    // Звёзды движутся медленно
    stars.rotation.y += 0.0001;

    // Мягко подсвечиваем глобус
    blueLight.position.x = Math.sin(Date.now() * 0.0005) * 4;

    renderer.render(scene, camera);
}

animate();

// 13. АДАПТАЦИЯ ПОД ЭКРАН
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
